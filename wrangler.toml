name = "mcp-dadosbr-aredes"
main = "build/lib/workers/worker.js"
compatibility_date = "2024-09-27"
compatibility_flags = ["nodejs_compat"]

# Migration to remove old Durable Objects
[[migrations]]
tag = "v2"
deleted_classes = ["DadosBRMCP"]

# Custom domain configuration - Will be set up via Dashboard

[env.production]
name = "mcp-dadosbr-aredes-prod"

[env.staging]
name = "mcp-dadosbr-aredes-staging"

[env.staging.vars]
MCP_TRANSPORT = "http"
MCP_HTTP_PORT = "8787"
MCP_CACHE_SIZE = "256"
MCP_CACHE_TTL = "60000"

[[env.staging.kv_namespaces]]
binding = "MCP_CACHE"
id = "69470c08bd184c7ba625f09690c8a1e9"

[[env.staging.kv_namespaces]]
binding = "MCP_KV"
id = "69470c08bd184c7ba625f09690c8a1e9"

[env.production.vars]
MCP_TRANSPORT = "http"
MCP_HTTP_PORT = "8787"
MCP_CACHE_SIZE = "256"
MCP_CACHE_TTL = "60000"

[[env.production.kv_namespaces]]
binding = "MCP_CACHE"
id = "9e3f2b99610b4c67abb1080b5f927efa"

[[env.production.kv_namespaces]]
binding = "MCP_KV"
id = "9e3f2b99610b4c67abb1080b5f927efa"

# Environment variables for configuration (default)
[vars]
MCP_TRANSPORT = "http"
MCP_HTTP_PORT = "8787"
MCP_CACHE_SIZE = "256"
MCP_CACHE_TTL = "60000"

# Build configuration
[build]
command = "npm run build:worker"
cwd = "."
watch_dir = "lib"

# NOTE: MCP_CACHE and MCP_KV currently share the same KV namespace ID; entries are isolated by
# key prefix (`rate_limit:*` for rate limiting vs tool cache keys) and bounded by mandatory
# expirationTtl >= 60s (`lib/core/cache.ts`, `lib/workers/rate-limit.ts`). Separate namespaces
# should be provisioned in the Cloudflare Dashboard during infrastructure rotation, and
# distributed atomic rate limiting requires Cloudflare native Rate Limiting binding or Durable Objects.
[[kv_namespaces]]
binding = "MCP_CACHE"
id = "9e3f2b99610b4c67abb1080b5f927efa"

# KV namespace for rate limiting and general storage (default)
[[kv_namespaces]]
binding = "MCP_KV"
id = "9e3f2b99610b4c67abb1080b5f927efa"
preview_id = "69470c08bd184c7ba625f09690c8a1e9"
