name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI/CD Pipeline run on this main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mcp-dadosbr-npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, publish and install npm package
    if: github.ref == 'refs/heads/main' && github.repository == 'cristianoaredes/mcp-dadosbr'
    runs-on: [self-hosted, linux, x64, "dadosbr-release-${{ github.run_id }}"]
    timeout-minutes: 12

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Confirm successful CI of the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          node --input-type=module <<'JS'
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_SHA, GH_TOKEN, CI_RUN_ID } = process.env;
          if (!/^\d+$/.test(CI_RUN_ID)) throw new Error("Expected a numeric CI run ID");
          const response = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: "application/vnd.github+json" },
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok) throw new Error(`Could not read CI run: HTTP ${response.status}`);
          const run = await response.json();
          if (run.head_sha !== GITHUB_SHA || run.head_branch !== "main" ||
              run.path?.split("@")[0] !== ".github/workflows/ci.yml" ||
              !["push", "workflow_dispatch"].includes(run.event) ||
              run.status !== "completed" || run.conclusion !== "success") {
            throw new Error("Release requires successful CI on the exact main commit");
          }
          console.log(`Verified CI run ${run.id} at ${GITHUB_SHA}`);
          JS

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and install candidate tarball
        id: package
        run: |
          npm ci
          npm run build
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"

          version=$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tarball="$RUNNER_TEMP/$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")"
          npm install --prefix "$RUNNER_TEMP/candidate" --no-audit --no-fund "$tarball"
          MCP_TEST_CLI="$RUNNER_TEMP/candidate/node_modules/@aredes.me/mcp-dadosbr/build/lib/adapters/cli.js" npm run test:transport
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-dadosbr-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error

      - name: Publish verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          package="@aredes.me/mcp-dadosbr"
          candidate=$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].integrity")
          latest=$(npm view "$package@latest" version)
          node - "$VERSION" "$latest" <<'JS'
          const [candidate, latest] = process.argv.slice(2);
          if (![candidate, latest].every((version) => /^\d+\.\d+\.\d+$/.test(version))) {
            throw new Error("Expected stable versions for the candidate and latest tag");
          }
          const latestParts = latest.split(".").map(Number);
          const differences = candidate.split(".").map((part, index) => Number(part) - latestParts[index]);
          const firstDifference = differences.find((value) => value !== 0) ?? 0;
          if (firstDifference < 0) {
            throw new Error(`Refusing to replace latest ${latest} with older version ${candidate}`);
          }
          JS
          published=$(npm view "$package@$VERSION" dist.integrity 2>/dev/null || true)
          if [[ -n "$published" ]]; then
            [[ "$published" == "$candidate" ]] || {
              echo "::error::Registry tarball differs from the validated candidate"
              exit 1
            }
            if [[ "$latest" != "$VERSION" ]]; then
              npm whoami >/dev/null
              npm dist-tag add "$package@$VERSION" latest
            fi
          else
            npm whoami >/dev/null
            npm publish "$TARBALL" --access public --tag latest
          fi

      - name: Validate clean installation from npm
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          package="@aredes.me/mcp-dadosbr"
          [[ "$(npm view "$package@latest" version)" == "$VERSION" ]]
          candidate=$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].integrity")
          [[ "$(npm view "$package@$VERSION" dist.integrity)" == "$candidate" ]]
          npm install --prefix "$RUNNER_TEMP/from-npm" --no-audit --no-fund "$package@$VERSION"
          MCP_TEST_CLI="$RUNNER_TEMP/from-npm/node_modules/$package/build/lib/adapters/cli.js" npm run test:transport
