name: Validate IBGE MCP App
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify IBGE MCP App (Node ${{ matrix.node }})
    if: github.repository == 'cristianoaredes/mcp-dadosbr' && github.actor == 'cristianoaredes' && github.ref == 'refs/heads/codex/ci-tck-0001-ibge-app'
    runs-on: [self-hosted, linux, x64, dadosbr-ubuntu-24.04, dadosbr-ibge-app-ci]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4d31292b85b4fdedda9d75deb3a10bdc5719540f
      - name: Confirm feature SHA
        env:
          FEATURE_SHA: 4d31292b85b4fdedda9d75deb3a10bdc5719540f
        run: |
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          echo "Verified product SHA: $FEATURE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:transport
      - name: Check npm asset
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e '
            const fs = require("node:fs");
            const [pkg] = JSON.parse(fs.readFileSync(0, "utf8"));
            const app = pkg.files.find(f => f.path === "build/lib/apps/ibge.html");
            if (!app || app.size < 1000) process.exit(1);
            console.log("PASS npm package includes", app.path, app.size, "bytes");
          '
      - run: npm run build:worker
